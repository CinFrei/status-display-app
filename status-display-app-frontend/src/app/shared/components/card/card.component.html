<div class="wrap-card">
  <div class="card-border-box">
    <app-icon-renderer
      [defaultSvgClass]="'custom-svg-icon'"
      [defaultFontClass]="'custom-font-icon'"
      [sizeClass]="'small-icon'"
      [iconRender]="iconRender"
    ></app-icon-renderer>
  </div>
  <div class="pl-10">
    <p class="ellipsis">
      {{ cardData.day }}
      <strong>{{ cardData.date }} {{ cardData.time }}</strong>
      <br />
      {{ cardData.title }}
    </p>
  </div>
</div>
