<div class="half-card">
  <!-- Anzeige des SVG, wenn iconType 'svg' ist und iconSvg vorhanden ist -->
  <app-icon-renderer [iconRender]="iconRender"></app-icon-renderer>
  <div class="pl-10">
    <p class="ellipsis-half">
      <strong *ngIf="statData.applyStrongTag">{{ obsDataContent1 }}</strong>
      <span *ngIf="!statData.applyStrongTag">{{ obsDataContent1 }}</span>
    </p>
    <p class="ellipsis-half">{{ obsDataContent2 }}</p>
  </div>
</div>
