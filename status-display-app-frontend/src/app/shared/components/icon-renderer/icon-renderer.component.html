<!-- Anzeige des SVG, wenn iconType 'svg' ist -->
<div class="icon-wrap">
  <img
    [ngClass]="[defaultSvgClass, sizeClass]"
    *ngIf="iconRender.iconType === 'svg' && iconRender.icon"
    [src]="'assets/' + iconRender.icon + '.svg'"
    alt="Icon"
  />

  <!-- Anzeige des Font-Icons, wenn iconType 'font' ist -->
  <span
    [ngClass]="[defaultFontClass, sizeClass]"
    *ngIf="iconRender.iconType === 'font'"
    class="material-symbols-rounded"
  >
    {{ iconRender.icon }}
  </span>
</div>
