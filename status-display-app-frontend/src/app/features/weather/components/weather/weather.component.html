<ng-container *ngIf="compact$ | async as data">
  <!-- Aktuelle Wetterdaten -->
  <ng-container>
    <app-icon-circle
      [icon]="data.wetterCode15.icon"
      [content]="data.temperatur15 + '°'"
    ></app-icon-circle>
  </ng-container>
  <!-- Aktuelle Wetterereignisse -->
  <ng-container *ngFor="let event of data.compact">
    <app-icon-circle
      [icon]="event.icon"
      [content]="event.value"
    ></app-icon-circle>
  </ng-container>
</ng-container>
