services:
  backend:
    build:
      context: ./status-display-app-backend
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "3000:3000"
    networks:
      - app-network

  frontend:
    build:
      context: ./status-display-app-frontend
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "4200:80"
    networks:
      - app-network
    depends_on:
      - backend

  kiosk:
    build:
      context: ./vnc-kiosk-server-custom
    restart: unless-stopped
    environment:
      - URL=http://frontend
      - TZ=Europe/Berlin
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "5901:5900"
    networks:
      - app-network
    depends_on:
      - frontend
      - backend
    privileged: true

networks:
  app-network:
    driver: bridge
    name: status_display_app_network
